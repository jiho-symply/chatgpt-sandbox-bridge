name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm install -g @openai/codex@0.155.1
      - run: node scripts/runtime-smoke.mjs
      - run: node scripts/stdio-smoke.mjs
      - name: Doctor
        env:
          CSB_WORKSPACE_ROOT: .
          CSB_STATE_DIR: ./.state-ci
          CSB_SANDBOX_MODE: externalSandbox
          CSB_LONG_JOBS: "true"
        run: node dist/cli.js --doctor

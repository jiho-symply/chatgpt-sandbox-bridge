services:
  bridge:
    build: .
    restart: unless-stopped
    user: "${CSB_UID:-1000}:${CSB_GID:-1000}"
    environment:
      HOME: /tmp/csb-home
      CSB_BEARER_TOKEN: ${CSB_BEARER_TOKEN}
      CSB_HOST: 0.0.0.0
      CSB_PORT: "8787"
      CSB_WORKSPACE_ROOT: /workspace
      CSB_STATE_DIR: /state
      CSB_SANDBOX_MODE: externalSandbox
      CSB_NETWORK: "true"
      CSB_LONG_JOBS: "true"
    volumes:
      - ./workspace:/workspace
      - ./.state:/state
    networks:
      - private
      - egress
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 4096
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8787/health"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 10s

  tunnel-client:
    image: ghcr.io/openai/tunnel-client:v0.0.14
    restart: unless-stopped
    depends_on:
      bridge:
        condition: service_healthy
    environment:
      CONTROL_PLANE_API_KEY: ${CONTROL_PLANE_API_KEY}
      CONTROL_PLANE_TUNNEL_ID: ${CONTROL_PLANE_TUNNEL_ID}
      MCP_SERVER_URL: http://bridge:8787/mcp
      MCP_EXTRA_HEADERS: "Authorization: env:CSB_BEARER_TOKEN"
      CSB_BEARER_TOKEN: ${CSB_BEARER_TOKEN}
      MCP_STARTUP_WAIT_TIMEOUT: 60s
      LOG_LEVEL: info
      LOG_FORMAT: json
      HEALTH_LISTEN_ADDR: ":8080"
    networks:
      - private
      - egress
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

networks:
  private:
    internal: true
  egress:
